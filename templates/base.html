<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} · Meal Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="{{ url_for('main.index') }}">Meal Planner</a>
        <nav>
            <ul>
                <li><a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Home</a></li>
                <li><a href="{{ url_for('main.recipes') }}" class="{{ 'active' if request.endpoint == 'main.recipes' }}">Recipes</a></li>
                <li><a href="{{ url_for('main.meal_plan') }}" class="{{ 'active' if request.endpoint == 'main.meal_plan' }}">Meal Plan</a></li>
            </ul>
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
