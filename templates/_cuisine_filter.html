<div class="field">
    <label for="cuisine-filter">Cuisine</label>
    <select id="cuisine-filter" name="cuisine" multiple size="6">
        {% for cuisine in cuisines %}
            <option value="{{ cuisine.value }}">{{ cuisine.value.replace('_', ' ') | title }}</option>
        {% endfor %}
    </select>
    <small>Hold Cmd/Ctrl to select multiple. Leave none selected for any cuisine.</small>
</div>
