{% extends 'base.html' %}

{% block title %}Meal Plan{% endblock %}

{% block content %}
    <h1 class="page-title">Meal Plan</h1>

    <section class="panel controls">
        {% include '_cuisine_filter.html' %}
        <label class="checkbox">
            <input type="checkbox" id="override-existing" name="override-existing">
            Override existing meal plan
        </label>
        <button id="generate-meal-plan" class="btn">Generate Meal Plan</button>
    </section>

    <div id="meal-plan-container" class="card">
        {% include '_meal_plan.html' %}
    </div>

    <script src="{{ url_for('static', filename='js/meal_plan_controller.js') }}"></script>
    <script>
        MealPlanController.init(
            "{{ url_for('generate_meal_plan') }}",
            "meal-plan-container",
            "generate-meal-plan",
            "override-existing",
            "cuisine-filter"
        );
    </script>
{% endblock %}
